name: Publish Minecraft sources (reference)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: chmod +x gradlew && ./gradlew createMinecraftArtifacts
      - name: Push sources to the mc-sources branch
        shell: bash
        run: |
          set -x
          SRC=$(find "$GITHUB_WORKSPACE" ~/.gradle -name "*.jar" 2>/dev/null | grep -iE "sources" | grep -iE "neoforge|minecraft" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error title=No sources jar::$(find "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/.gradle" -name '*.jar' 2>/dev/null | head -30 | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice title=Sources jar::$SRC"
          mkdir -p /tmp/out && cd /tmp/out
          unzip -q "$SRC" 'net/minecraft/*' 'net/neoforged/*' 'com/mojang/*' 'data/*' || unzip -q "$SRC"
          git init -q -b mc-sources
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Minecraft + NeoForge sources (reference only)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mc-sources
