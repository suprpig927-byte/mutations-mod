name: Publish Minecraft sources (reference)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: chmod +x gradlew && ./gradlew createMinecraftArtifacts
      - name: Push sources to the mc-sources branch
        shell: bash
        run: |
          set -x
          SRC=""
          for j in $(find "$GITHUB_WORKSPACE" ~/.gradle -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/block/Block.java"; then SRC="$j"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "::error title=No sources jar::$(find "$GITHUB_WORKSPACE/build" -name '*.jar' 2>/dev/null | head -30 | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice title=Sources jar::$SRC"
          mkdir -p /tmp/out && cd /tmp/out
          unzip -q "$SRC" || true
          find . -name "*.class" -delete
          echo "::notice title=Files::$(find . -type f | wc -l)"
          git init -q -b mc-sources
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Minecraft + NeoForge sources (reference only)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mc-sources
