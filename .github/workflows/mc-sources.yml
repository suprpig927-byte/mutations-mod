name: Publish Minecraft sources (reference)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: chmod +x gradlew && ./gradlew createMinecraftArtifacts
      - name: Push sources to the mc-sources branch
        shell: bash
        run: |
          set -x
          echo "::notice title=Build jars::$(find "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/.gradle" -name '*.jar' 2>/dev/null | head -30 | awk '{printf "%s%%0A", $0}')"
          JAR=$(find "$GITHUB_WORKSPACE/build/moddev/artifacts" -name "minecraft-patched-*.jar" | head -1)
          curl -sSL -o /tmp/vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir -p /tmp/dec
          java -Xmx6g -jar /tmp/vineflower.jar -dgs=1 -asc=1 -log=WARN "$JAR" /tmp/dec/ > /tmp/vf.log 2>&1 || true
          SRC=$(find /tmp/dec -name "*.jar" | head -1)
          echo "::notice title=Decompiled::$SRC $(ls -la /tmp/dec | head -5 | awk '{printf "%s%%0A", $0}')"
          mkdir -p /tmp/out && cd /tmp/out
          if [ -n "$SRC" ]; then unzip -q "$SRC" || true; else cp -r /tmp/dec/. . ; fi
          find . -name "*.class" -delete
          echo "::notice title=Files::$(find . -type f | wc -l)"
          git init -q -b mc-sources
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Minecraft + NeoForge sources (reference only)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mc-sources
